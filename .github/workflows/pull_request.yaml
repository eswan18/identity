name: Pull Request

on:
  pull_request:
    branches: [main]
  # Also on main itself. Two PRs that are each green can still leave main stale
  # -- one adds a migration, the other regenerates pkg/db without it -- and
  # nothing would notice until somebody's unrelated PR went red.
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Don't worry, this is a key used only for testing.
      JWT_PRIVATE_KEY: |
        -----BEGIN EC PRIVATE KEY-----
        MHcCAQEEICQMNHONu2Sud2tu6jgOZs3LIj5yOZr89NBMLYiyqBK/oAoGCCqGSM49
        AwEHoUQDQgAERCHWHrX20emk31HypGNgptwBjdZOyBybV/9BLTbJPj8UsZ/46ri5
        /eFKkRfNApxFU/5lk1RGQJqt8t0GvkkJdw==
        -----END EC PRIVATE KEY-----
      JWT_ISSUER: http://localhost:8080
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      # The generated *_templ.go files are committed (go build / the steps below
      # never run `templ generate`). Regenerate here and fail if anything drifts,
      # so a .templ edit that wasn't regenerated — or stale committed output —
      # can't slip through green CI. Pinned to the templ version in go.mod so the
      # generator output matches what produced the committed files.
      - name: Verify templ generation is up to date
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          templ generate
          # Stage first: git diff alone ignores untracked files, so a NEW
          # component's generated file would leave this green while
          # uncommitted. Same trap the sqlc check below is written to avoid.
          git add -A
          git diff --cached --exit-code || { echo "::error::templ output is stale — run 'make templ' (or 'templ generate') and commit the result."; exit 1; }

      # pkg/db is generated from db/migrations by sqlc (see sqlc.yaml) and the
      # output is committed, so nothing at build time would notice it drifting
      # from the migrations.
      #
      # This uses `sqlc diff` via make rather than regenerating and running
      # `git diff --exit-code`. That pairing looks equivalent and is not: git
      # diff does not report untracked files, so a *new* generated file -- what
      # adding a query produces, the likeliest reason to need this guard --
      # leaves the check green while the file sits uncommitted. Worse, because
      # this step runs before build and test, it materialises that file just in
      # time for them to pass on it, and main breaks for everyone on merge.
      #
      # The version lives in the Makefile so CI and contributors cannot skew.
      - name: Verify sqlc output matches the migrations
        run: make sqlc-check

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Run unit tests
        run: go test -v ./...

      # Integration tests are gated behind the `integration` build tag. They use
      # testcontainers to spin up Postgres/MinIO, which relies on the Docker
      # daemon available on GitHub-hosted ubuntu runners. Scoped to the packages
      # that hold them and to the suite/test entrypoints so the untagged unit
      # tests (already run above) aren't rebuilt and re-run a second time.
      - name: Run integration tests
        run: go test -v -tags integration -timeout 600s -run 'TestOAuthFlowSuite|TestAvatarFlowSuite|TestUpAgainstPostgres' ./pkg/httpserver/ ./db/migrations/
